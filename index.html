<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STRATUS CLOUD</title><link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:VT323,monospace}.wrap{max-width:1500px;margin:auto;padding:22px}.glow{border:1px solid #fff;box-shadow:0 0 8px #fff,inset 0 0 8px #ffffff20}header{display:flex;align-items:center;gap:16px;padding:16px 18px;background:#080808;position:sticky;top:10px;z-index:5}.logo{font-size:38px;letter-spacing:2px;text-shadow:0 0 10px #fff}.sub{opacity:.6;font-size:18px}.config{margin-left:auto}.config input{width:330px}input,button,select{font:inherit;color:#fff;background:#090909;border:1px solid #777;padding:9px 11px;outline:none}button{cursor:pointer}button:hover,input:focus{border-color:#fff;box-shadow:0 0 8px #ffffff55}.hero{padding:28px 8px 20px}.hero h1{font-size:54px;margin:0;text-shadow:0 0 12px #fff}.hero p{font-size:21px;opacity:.7;margin:5px 0}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 20px}.search{flex:1;min-width:240px}.status{font-size:18px;opacity:.75;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:#090909;overflow:hidden;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 0 16px #ffffff55}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#111;display:block}.cardbody{padding:12px}.name{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{font-size:15px;opacity:.55;margin-top:4px}.desc{font-size:16px;opacity:.7;margin-top:8px;height:45px;overflow:hidden}.modal{position:fixed;inset:0;background:#000d;display:none;place-items:center;padding:18px;z-index:20}.modal.open{display:grid}.panel{width:min(1100px,100%);max-height:94vh;overflow:auto;background:#060606;padding:18px}.panel h2{font-size:38px;margin:0 0 10px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.videoWrap{margin-top:14px;background:#000;position:relative;aspect-ratio:16/9}.videoWrap video{width:100%;height:100%;display:block;background:#000}.timer{position:absolute;right:12px;top:12px;padding:7px 12px;background:#050505;border:1px solid #fff;font-size:24px;text-shadow:0 0 7px #fff}.log{white-space:pre-wrap;min-height:70px;max-height:150px;overflow:auto;border:1px solid #333;padding:10px;margin-top:10px;color:#bbb}.close{float:right}.notice{font-size:15px;opacity:.55;margin-top:14px}@media(max-width:700px){.wrap{padding:10px}.config{width:100%;margin:0}.config input{width:100%}.hero h1{font-size:42px}}</style></head><body><div class="wrap"><header class="glow"><div><div class="logo">STRATUS CLOUD</div><div class="sub">cloud gaming frontend</div></div><div class="config"><input id="apiBase" placeholder="Backend URL"><input id="apiKey" type="password" placeholder="API key"><button id="saveConfig">SAVE</button></div></header><section class="hero"><h1>PLAY FROM THE CLOUD.</h1><p>Game catalog + real session lifecycle + WebRTC streaming.</p></section><div class="tools"><input id="search" class="search" placeholder="Search games..."><select id="tag"><option value="">All categories</option></select><button id="reload">↻ Reload</button></div><div id="status" class="status">Loading catalog...</div><div id="grid" class="grid"></div><div class="notice">This website uses Stratus API to provide some of its services.</div></div><div id="modal" class="modal"><div class="panel glow"><button class="close" id="close">X</button><h2 id="gameTitle">Game</h2><div id="gameInfo" class="status"></div><div class="row"><button id="play">▶ PLAY</button><button id="quit" disabled>■ QUIT</button></div><div id="videoWrap" class="videoWrap" style="display:none"><video id="stream" autoplay playsinline></video><div id="timer" class="timer">19:00</div></div><div id="log" class="log"></div></div></div><script>const CATALOG_URL='https://raw.githubusercontent.com/x8rr/stratus-api/main/cloud.json';let games=[],selected=null,uuid=null,ws=null,pc=null,timerEnd=0,timerLoop=null,pingLoop=null;const $=id=>document.getElementById(id),api=()=>($('apiBase').value||'').replace(/\/+$/,''),headers=()=>({'Content-Type':'application/json','X-API-Key':$('apiKey').value||''}),log=m=>{$('log').textContent+=m+'\n';$('log').scrollTop=$('log').scrollHeight};const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};async function loadCatalog(){const d=await(await fetch(CATALOG_URL,{cache:'no-store'})).json();games=d;$('tag').innerHTML='<option value="">All categories</option>'+[...new Set(games.flatMap(g=>g.tags||[]))].sort().map(t=>`<option>${esc(t)}</option>`).join('');render();$('status').textContent=games.length+' available titles'}function render(){let q=$('search').value.toLowerCase(),t=$('tag').value;let a=games.filter(g=>(!q||(`${g.name} ${g.description||''} ${(g.tags||[]).join(' ')}`).toLowerCase().includes(q))&&(!t||(g.tags||[]).includes(t)));$('grid').innerHTML=a.map(g=>`<article class="card glow" data-key="${esc(g.game_key)}"><img class="thumb" src="${esc(g.image||g.cover||'')}" loading="lazy"><div class="cardbody"><div class="name">${esc(g.name)}</div><div class="tags">${esc((g.tags||[]).join(' • '))}</div><div class="desc">${esc(g.description||'')}</div></div></article>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openGame(games.find(g=>g.game_key===c.dataset.key)))}function openGame(g){selected=g;$('gameTitle').textContent=g.name;$('gameInfo').textContent=(g.tags||[]).join(' • ');$('modal').classList.add('open');resetPlayer();$('log').textContent=''}function resetPlayer(){if(timerLoop)clearInterval(timerLoop);if(pingLoop)clearInterval(pingLoop);try{ws?.close()}catch{}try{pc?.close()}catch{}ws=null;pc=null;uuid=null;$('videoWrap').style.display='none';$('play').disabled=false;$('quit').disabled=true}async function*createSession(game_key){let r=await fetch(api()+'/cloud/v1/createSession',{method:'POST',headers:headers(),body:JSON.stringify({game_key})});if(!r.ok)throw Error(await r.text());let reader=r.body.getReader(),dec=new TextDecoder(),buf='';while(true){let x=await reader.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});let lines=buf.split('\n');buf=lines.pop();for(const l of lines)if(l.trim())yield JSON.parse(l)}}async function start(){if(!selected||!api())return log('Set the backend URL first.');$('play').disabled=true;try{for await(const e of createSession(selected.game_key)){log(JSON.stringify(e));if(e.status==='queue'){uuid=e.uuid;await poll()}if(e.status==='finished_queue'){uuid=e.uuid;await activate()}if(e.status==='error')throw Error(e.error||'Session failed')}}catch(e){log('ERROR: '+e.message);$('play').disabled=false}}async function poll(){while(uuid){await new Promise(r=>setTimeout(r,3500));let r=await fetch(api()+'/cloud/v1/getQueue?uuid='+encodeURIComponent(uuid),{headers:{'X-API-Key':$('apiKey').value||''}});let e=await r.json();log(JSON.stringify(e));if(e.status==='finished_queue'){await activate();return}if(e.status!=='queue')throw Error(e.error||'Queue failed')}}async function activate(){let r=await fetch(api()+'/cloud/v1/startGame',{method:'POST',headers:headers(),body:JSON.stringify({uuid})}),d=await r.json();if(!r.ok)throw Error(d.error||'startGame failed');$('quit').disabled=false;$('videoWrap').style.display='block';timerEnd=Date.now()+d.max_seconds*1000;timerLoop=setInterval(()=>{$('timer').textContent=fmt((timerEnd-Date.now())/1000)},250);pingLoop=setInterval(ping,3000);await rtc(d.ice_servers,d.signaling_ws)}async function ping(){if(!uuid)return;let r=await fetch(api()+'/cloud/v1/pingSession',{method:'POST',headers:headers(),body:JSON.stringify({uuid})});if(r.ok){let d=await r.json();timerEnd=Date.now()+(d.session_time_limit_seconds-d.session_time_used_seconds)*1000}}async function rtc(ice,signal){ws=new WebSocket(signal);await new Promise((resolve,reject)=>{ws.onopen=async()=>{pc=new RTCPeerConnection({iceServers:ice});pc.addTransceiver('video',{direction:'recvonly'});pc.ontrack=e=>{$('stream').srcObject=e.streams[0];$('stream').play().catch(()=>{})};pc.onicecandidate=e=>{if(e.candidate)ws.send(JSON.stringify({type:'rtc_candidate',candidate:e.candidate.toJSON()}))};pc.onconnectionstatechange=()=>log('WebRTC: '+pc.connectionState);let o=await pc.createOffer();await pc.setLocalDescription(o);ws.send(JSON.stringify({type:'rtc_offer',sdp:o.sdp}));resolve()};ws.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==='rtc_answer')await pc.setRemoteDescription(new RTCSessionDescription(m.sdp));else if(m.type==='rtc_candidate')try{await pc.addIceCandidate(new RTCIceCandidate(m.candidate))}catch{}};ws.onerror=()=>reject(Error('Signaling WebSocket failed'))})}async function quit(){if(!uuid)return;await fetch(api()+'/cloud/v1/quitSession',{method:'POST',headers:headers(),body:JSON.stringify({uuid})}).catch(()=>{});log('Session ended.');resetPlayer()}$('saveConfig').onclick=()=>{localStorage.setItem('stratus_backend',$('apiBase').value);localStorage.setItem('stratus_key',$('apiKey').value);log('Configuration saved. Reloading catalog...');};$('apiBase').value=localStorage.getItem('stratus_backend')||'';$('apiKey').value=localStorage.getItem('stratus_key')||'';$('search').oninput=render;$('tag').onchange=render;$('reload').onclick=loadCatalog;$('play').onclick=start;$('quit').onclick=quit;$('close').onclick=()=>{$('modal').classList.remove('open');resetPlayer()};loadCatalog().catch(e=>$('status').textContent='Catalog failed: '+e.message);</script></body></html>
